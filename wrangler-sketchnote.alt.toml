# ACHTUNG – nicht verwenden.
# Alte Konfiguration aus der Zeit, als dieses Projekt als Worker "sketchnote" lief.
# Die Visual Thinking Toolbox läuft heute als Cloudflare-Pages-Projekt "visualthinkingtoolbox"
# (Funktionen unter functions/). Ein "wrangler deploy" mit dieser Datei würde den Worker
# "sketchnote" (Sketchnote-App) überschreiben. Deshalb umbenannt – wrangler findet sie so nicht.

name = "sketchnote"
main = "worker.js"
compatibility_date = "2025-05-01"

[build]
command = "npm run build"

[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = true

# Rate limiting: max 30 Anfragen pro 60 Sek. je IP (Claude SVG/JSON)
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
