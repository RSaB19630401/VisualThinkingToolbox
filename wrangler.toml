name = "sketchnote"
main = "worker.js"
compatibility_date = "2025-05-01"

[build]
command = "npm run build"

[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = true

# Rate limiting: max 30 Anfragen pro 60 Sek. je IP (Claude SVG/JSON)
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
